<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071A2F" />
    <title>Dashboard | ExamsTurbo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body class="auth-page" data-auth-page="dashboard">
    <header class="auth-topbar">
      <div class="container auth-topbar-inner">
        <a class="brand auth-brand" href="../index.html" aria-label="ExamsTurbo home">
          <span class="brand-mark">
            <img src="../assets/images/exams-turbo-icon.png" alt="" aria-hidden="true" />
          </span>
          <span><span class="brand-exams">EXAMS</span><span class="brand-turbo">TURBO</span></span>
        </a>
        <a class="auth-home-link" href="../vendors.html">Browse Vendors</a>
      </div>
    </header>

    <main class="auth-main">
      <section class="auth-card auth-card-wide" aria-labelledby="dashboardTitle">
        <p class="auth-eyebrow">Your ExamsTurbo account</p>
        <div id="dashboardLoading" class="auth-loading" role="status">Verifying your session...</div>
        <div id="dashboardMessage" class="auth-feedback" role="alert" aria-live="polite" hidden></div>
        <button id="retrySession" class="btn btn-outline-light portal-btn" type="button" hidden>
          Try Again
        </button>

        <div id="dashboardContent" class="auth-dashboard-content" hidden>
          <h1 id="dashboardTitle">Welcome back, <span id="welcomeName"></span></h1>
          <p class="auth-description">Your account is signed in and ready.</p>
          <div class="auth-account-list">
            <div class="auth-account-item">
              <span>Email address</span>
              <strong id="accountEmail"></strong>
            </div>
            <div class="auth-account-item">
              <span>Account role</span>
              <strong id="accountRole"></strong>
            </div>
          </div>
          <button id="logoutButton" class="btn btn-orange auth-submit" type="button">
            Logout
          </button>
        </div>
      </section>
    </main>

    <footer class="auth-footer">© 2026 ExamsTurbo. All rights reserved.</footer>
    <script type="module" src="../js/auth-pages.js"></script>
  </body>
</html>
