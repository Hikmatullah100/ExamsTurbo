<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071A2F" />
    <title>Create Account | ExamsTurbo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <link rel="icon" type="image/png" href="/assets/images/exams-turbo-icon.png" />
  <link rel="apple-touch-icon" href="/assets/images/exams-turbo-icon.png" />
</head>
  <body class="auth-page" data-auth-page="register">
    <header class="auth-topbar">
      <div class="container auth-topbar-inner">
        <a class="brand auth-brand" href="/" aria-label="ExamsTurbo home">
          <span class="brand-mark">
            <img src="../assets/images/exams-turbo-icon.png" alt="" aria-hidden="true" />
          </span>
          <span><span class="brand-exams">EXAMS</span><span class="brand-turbo">TURBO</span></span>
        </a>
        <a class="auth-home-link" href="/vendors/">Browse Vendors</a>
      </div>
    </header>

    <main class="auth-main">
      <section class="auth-card" aria-labelledby="authTitle">
        <p class="auth-eyebrow">ExamsTurbo account</p>
        <h1 id="authTitle">Create an account</h1>
        <p class="auth-description">Create your account to get started.</p>

        <div id="formMessage" class="auth-feedback" role="alert" aria-live="polite" hidden></div>

        <form id="registerForm" class="auth-form" novalidate>
          <div class="auth-field">
            <label for="fullName">Full Name</label>
            <input
              class="auth-input"
              id="fullName"
              name="fullName"
              type="text"
              autocomplete="name"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="auth-field">
            <label for="email">Email Address</label>
            <input
              class="auth-input"
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="Enter your email address"
              required
            />
          </div>

          <div class="auth-field">
            <label for="password">Password</label>
            <div class="auth-password-wrap">
              <input
                class="auth-input"
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                placeholder="Create a password"
                minlength="8"
                required
              />
              <button
                class="auth-password-toggle"
                type="button"
                data-password-toggle="password"
                aria-label="Show password"
                aria-pressed="false"
              >
                <i class="fa-solid fa-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div class="auth-field">
            <label for="confirmPassword">Confirm Password</label>
            <div class="auth-password-wrap">
              <input
                class="auth-input"
                id="confirmPassword"
                name="confirmPassword"
                type="password"
                autocomplete="new-password"
                placeholder="Confirm your password"
                minlength="8"
                required
              />
              <button
                class="auth-password-toggle"
                type="button"
                data-password-toggle="confirmPassword"
                aria-label="Show password"
                aria-pressed="false"
              >
                <i class="fa-solid fa-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <button class="btn btn-orange auth-submit" type="submit">Create Account</button>
        </form>

        <p class="auth-switch">
          Already have an account?
          <a class="auth-link" href="../login/">Login</a>
        </p>
        <a class="auth-back-link" href="/">
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
          Back to ExamsTurbo
        </a>
      </section>
    </main>

    <footer class="auth-footer">© 2026 ExamsTurbo. All rights reserved.</footer>
    <script type="module" src="../js/auth-pages.js"></script>
  </body>
</html>
